name: SlotBack CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  backend:
    name: Backend — Python lint, migrate, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slotback_test
          POSTGRES_USER: slotback
          POSTGRES_PASSWORD: slotback_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotback -d slotback_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slotback:slotback_test_password@localhost:5432/slotback_test
      TEST_DATABASE_URL: postgresql+psycopg://slotback:slotback_test_password@localhost:5432/slotback_test
      APP_ENV: test
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:5173"
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Validate Alembic migrations against clean database
        run: alembic upgrade head

      - name: Run unit and integration/API tests
        run: pytest -ra -v

  frontend:
    name: Frontend — TypeScript check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install frontend dependencies (locked)
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm --prefix frontend exec tsc --noEmit

      - name: Build frontend
        run: pnpm --prefix frontend build

  e2e:
    name: Browser E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: slotback_e2e
          POSTGRES_USER: slotback
          POSTGRES_PASSWORD: slotback_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotback -d slotback_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slotback:slotback_test_password@localhost:5432/slotback_e2e
      TEST_DATABASE_URL: postgresql+psycopg://slotback:slotback_test_password@localhost:5432/slotback_e2e
      APP_ENV: test
      DEBUG: "false"
      CORS_ORIGINS: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt playwright pytest-playwright

      - name: Install frontend dependencies (locked)
        run: pnpm --prefix frontend install --frozen-lockfile

      - name: Build frontend for SPA serving in E2E
        run: pnpm --prefix frontend build

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Alembic migrations for E2E database
        run: alembic upgrade head

      - name: Run Playwright E2E tests
        run: pytest backend/tests/e2e/ -ra -v --timeout=60
